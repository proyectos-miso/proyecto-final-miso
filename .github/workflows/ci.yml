name: CI - Integración Continua

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: ningún trabajo del CI necesita escribir en el repositorio.
permissions:
  contents: read

jobs:
  # 1. Pruebas automatizadas del Monolito Modular Backend
  backend-ci:
    name: Backend CI (Pytest & Poetry)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solventa
          POSTGRES_USER: solventa_user
          POSTGRES_PASSWORD: solventa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solventa_user -d solventa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # S3 emulado para las pruebas de la carátula (HU-WEB-16); la imagen trae su propio chequeo de salud.
      floci:
        image: floci/floci:2.3.0
        ports:
          - 4566:4566
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cachear entorno virtual de Poetry
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Instalar dependencias con Poetry
        run: poetry install --no-interaction

      - name: Ejecutar pruebas unitarias y cobertura (pytest)
        run: poetry run pytest --cov-fail-under=85 --junitxml=test-results/junit.xml

      - name: Resumen de pruebas
        if: always()
        run: python3 ../scripts/ci/junit_summary.py "Backend (pytest)" test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: backend/test-results/
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  # 2. Pruebas automatizadas y compilación del Portal Web
  web-ci:
    name: Web CI (Angular 22 & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con Vitest y cobertura
        run: >-
          npm test -- --watch=false --coverage --coverage-reporters=lcov --coverage-reporters=text-summary
          --reporters=junit --reporters=default --output-file=test-results/junit.xml

      - name: Resumen de pruebas
        if: always()
        run: python3 ../scripts/ci/junit_summary.py "Web (Vitest)" test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-web
          path: web/test-results/
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: web/coverage/

      - name: Compilar aplicación web para producción
        run: npm run build

  # 3. Pruebas automatizadas de la Aplicación Móvil Android
  mobile-ci:
    name: Mobile CI (Android & Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias de depuración y cobertura (Kover)
        run: ./gradlew testDebugUnitTest koverXmlReportDebug

      - name: Resumen de pruebas
        if: always()
        run: python3 ../scripts/ci/junit_summary.py "Móvil (JUnit, Robolectric y Compose)" app/build/test-results/testDebugUnitTest/*.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-movil
          path: movil/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-movil
          path: movil/app/build/reports/kover/reportDebug.xml

  # 3b. APK de release firmado al integrar a dev (HU-MOV-09, AC-10). La llave solo vive en los secretos de GitHub;
  # sin ellos, o sin la URL HTTPS del API en la variable ANDROID_API_BASE_URL, el trabajo se omite con un aviso.
  mobile-release:
    name: Mobile release (APK firmado)
    runs-on: ubuntu-latest
    needs: [mobile-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    env:
      RELEASE_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && vars.ANDROID_API_BASE_URL != '' }}
    defaults:
      run:
        working-directory: movil
    steps:
      - name: Aviso de configuración pendiente
        if: env.RELEASE_READY != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "::notice::APK de release omitido - faltan los secretos de la llave de firma o la variable ANDROID_API_BASE_URL."

      - name: Checkout del repositorio
        if: env.RELEASE_READY == 'true'
        uses: actions/checkout@v4

      - name: Configurar Java 17 LTS
        if: env.RELEASE_READY == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        if: env.RELEASE_READY == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar la llave de firma en un archivo temporal
        if: env.RELEASE_READY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compilar el APK de release firmado
        if: env.RELEASE_READY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PapiBaseUrl="$API_BASE_URL"

      - name: Borrar la llave de firma del runner
        if: always() && env.RELEASE_READY == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # Solo existe app-release.apk si quedó firmado; sin firma Gradle lo llama app-release-unsigned.apk.
      - name: Publicar el APK de release
        if: env.RELEASE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: solventa-release-apk
          path: movil/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # 4. Verificación de sintaxis y módulos de Terraform
  terraform-ci:
    name: Terraform CI (Lint & Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Inicializar módulos de Terraform
        run: terraform init -backend=false

      - name: Validar formato del código
        run: terraform fmt -check

      - name: Validar integridad de la configuración
        run: terraform validate

      - name: Probar el plan sin infraestructura creada
        run: terraform test

  # 5. Análisis estático y cobertura en SonarCloud (requiere el secreto SONAR_TOKEN)
  sonarcloud:
    name: SonarCloud (Cobertura y calidad)
    runs-on: ubuntu-latest
    needs: [backend-ci, web-ci, mobile-ci]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout del repositorio
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reportes de cobertura
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*

      - name: Ubicar reportes en sus componentes
        if: env.SONAR_TOKEN != ''
        run: |
          cp coverage-backend/coverage.xml backend/coverage.xml
          mkdir -p web/coverage && cp -r coverage-web/. web/coverage/
          sed -i 's|^SF:src/|SF:web/src/|' web/coverage/web/lcov.info
          mkdir -p movil/app/build/reports/kover && cp coverage-movil/reportDebug.xml movil/app/build/reports/kover/

      - name: Analizar con SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Aviso de configuración pendiente
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SonarCloud omitido - falta configurar el secreto SONAR_TOKEN en el repositorio."

  # 6. Gate SDD: specs, secretos, rutas críticas y dependencias (sdd/README.md)
  sdd-gate:
    name: SDD gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probar el validador y los gates
        run: python -m unittest discover -s sdd/tools/tests -t sdd/tools/tests

      - name: Probar los scripts del CI
        run: python -m unittest discover -s scripts/ci -t scripts/ci

      - name: Validar specs, secretos, rutas críticas y dependencias
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python sdd/tools/sdd.py gate --base "origin/$BASE_REF"
          else
            python sdd/tools/sdd.py gate
          fi
