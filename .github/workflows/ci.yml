name: CI - Integración Continua

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: ningún trabajo del CI necesita escribir en el repositorio.
permissions:
  contents: read

jobs:
  # 1. Pruebas automatizadas del Monolito Modular Backend
  backend-ci:
    name: Backend CI (Pytest & Poetry)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solventa
          POSTGRES_USER: solventa_user
          POSTGRES_PASSWORD: solventa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solventa_user -d solventa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cachear entorno virtual de Poetry
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Instalar dependencias con Poetry
        run: poetry install --no-interaction

      - name: Ejecutar pruebas unitarias y cobertura (pytest)
        run: poetry run pytest --junitxml=test-results/junit.xml

      - name: Resumen de pruebas
        if: always()
        run: python3 ../scripts/ci/junit_summary.py "Backend (pytest)" test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: backend/test-results/
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  # 2. Pruebas automatizadas y compilación del Portal Web
  web-ci:
    name: Web CI (Angular 22 & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con Vitest y cobertura
        run: >-
          npm test -- --watch=false --coverage --coverage-reporters=lcov --coverage-reporters=text-summary
          --reporters=junit --reporters=default --output-file=test-results/junit.xml

      - name: Resumen de pruebas
        if: always()
        run: python3 ../scripts/ci/junit_summary.py "Web (Vitest)" test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-web
          path: web/test-results/
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: web/coverage/

      - name: Compilar aplicación web para producción
        run: npm run build

  # 3. Pruebas automatizadas de la Aplicación Móvil Android
  mobile-ci:
    name: Mobile CI (Android & Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias de depuración y cobertura (Kover)
        run: ./gradlew testDebugUnitTest koverXmlReportDebug

      - name: Resumen de pruebas
        if: always()
        run: python3 ../scripts/ci/junit_summary.py "Móvil (JUnit, Robolectric y Compose)" app/build/test-results/testDebugUnitTest/*.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-movil
          path: movil/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-movil
          path: movil/app/build/reports/kover/reportDebug.xml

  # 4. Verificación de sintaxis y módulos de Terraform
  terraform-ci:
    name: Terraform CI (Lint & Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Inicializar módulos de Terraform
        run: terraform init -backend=false

      - name: Validar formato del código
        run: terraform fmt -check

      - name: Validar integridad de la configuración
        run: terraform validate

      - name: Probar el plan sin infraestructura creada
        run: terraform test

  # 5. Análisis estático y cobertura en SonarCloud (requiere el secreto SONAR_TOKEN)
  sonarcloud:
    name: SonarCloud (Cobertura y calidad)
    runs-on: ubuntu-latest
    needs: [backend-ci, web-ci, mobile-ci]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout del repositorio
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reportes de cobertura
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*

      - name: Ubicar reportes en sus componentes
        if: env.SONAR_TOKEN != ''
        run: |
          cp coverage-backend/coverage.xml backend/coverage.xml
          mkdir -p web/coverage && cp -r coverage-web/. web/coverage/
          sed -i 's|^SF:src/|SF:web/src/|' web/coverage/web/lcov.info
          mkdir -p movil/app/build/reports/kover && cp coverage-movil/reportDebug.xml movil/app/build/reports/kover/

      - name: Analizar con SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5

      - name: Aviso de configuración pendiente
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SonarCloud omitido - falta configurar el secreto SONAR_TOKEN en el repositorio."

  # 6. Gate SDD: specs, secretos, rutas críticas y dependencias (sdd/README.md)
  sdd-gate:
    name: SDD gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probar el validador y los gates
        run: python -m unittest discover -s sdd/tools/tests -t sdd/tools/tests

      - name: Probar los scripts del CI
        run: python -m unittest discover -s scripts/ci -t scripts/ci

      - name: Validar specs, secretos, rutas críticas y dependencias
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python sdd/tools/sdd.py gate --base "origin/$BASE_REF"
          else
            python sdd/tools/sdd.py gate
          fi
