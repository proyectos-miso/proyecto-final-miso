<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #0f172a; }
      .partner-header { fill: #1e293b; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .text-title { fill: #0f172a; font-weight: 700; font-size: 18px; }
      .text-subtitle { fill: #64748b; font-size: 13px; }
      .text-brand { fill: #38bdf8; font-weight: 700; font-size: 18px; }
      .text-subbrand { fill: #94a3b8; font-size: 12px; }
      .text-user { fill: #cbd5e1; font-size: 12px; }
      .text-user-name { fill: #38bdf8; font-weight: 600; }
      .nav-tab { fill: #94a3b8; font-size: 13px; font-weight: 500; }
      .nav-tab-active { fill: #38bdf8; font-size: 13px; font-weight: 600; }
      .tab-indicator { fill: #38bdf8; }
      .btn-primary { fill: #0b5474; rx: 6; cursor: pointer; }
      .btn-primary-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .btn-secondary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6; cursor: pointer; }
      .btn-secondary-text { fill: #334155; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .section-hdr { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .label-text { fill: #64748b; font-size: 11px; font-weight: 600; }
      .val-text { fill: #0f172a; font-size: 13px; font-weight: 500; }
      .chip-ok { fill: #dcfce7; rx: 10; }
      .chip-ok-text { fill: #15803d; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .chip-partner { fill: #e0f2fe; rx: 4; }
      .chip-partner-text { fill: #0369a1; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .hero-price { fill: #0b5474; font-size: 26px; font-weight: 800; }
      .code-box { fill: #0f172a; stroke: #1e293b; stroke-width: 1; rx: 6; }
      .code-header { fill: #1e293b; }
      .code-title { fill: #94a3b8; font-size: 11px; font-family: monospace; }
      .code-text { fill: #38bdf8; font-family: monospace; font-size: 11px; }
      .code-val { fill: #a5f3fc; font-family: monospace; font-size: 11px; }
      .code-comment { fill: #64748b; font-family: monospace; font-size: 10px; }
      .progress-bg { fill: #e2e8f0; rx: 4; }
      .progress-fill { fill: #f59e0b; rx: 4; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="680" class="bg" />

  <!-- App Header (Solventa B2B Gateway / Banco Aliado) -->
  <rect width="1000" height="54" class="header-bg" />
  <text x="30" y="33" class="text-brand">Solventa</text>
  <text x="112" y="33" class="text-subbrand">B2B Quote Edge</text>
  
  <text x="260" y="33" class="nav-tab">Documentación</text>
  <text x="390" y="33" class="nav-tab-active">Canal Banco Aliado</text>
  <rect x="390" y="49" width="125" height="3" class="tab-indicator" />
  <text x="545" y="33" class="nav-tab">Métricas &amp; Cuotas</text>
  
  <text x="730" y="33" class="text-user">Socio: <tspan class="text-user-name">Banco Aliado S.A.</tspan></text>
  <rect x="905" y="17" width="65" height="24" fill="transparent" stroke="#475569" stroke-width="1" rx="4" />
  <text x="937" y="33" fill="#cbd5e1" font-size="11px" font-weight="500" text-anchor="middle">API Live</text>

  <!-- Title & Context -->
  <g transform="translate(30, 75)">
    <text x="0" y="15" fill="#64748b" font-size="12px">Portal de Integración B2B &gt; Monitoreo de Cuota &gt; Solicitud Aceptada</text>
    <text x="0" y="42" class="text-title">Canal del Socio con Oferta Activa y Telemetría de Cuota (200 OK)</text>
    <text x="0" y="62" class="text-subtitle">El socio visualiza la oferta cotizada y recibe en las cabeceras HTTP su límite contratado, solicitudes restantes y hora de renovación.</text>
  </g>

  <!-- Left Column: What the Bank Customer / Portal Sees -->
  <g transform="translate(30, 160)">
    <rect width="460" height="490" class="card-bg" />
    
    <!-- Partner Card Header -->
    <rect width="460" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="8" />
    <text x="20" y="26" class="section-hdr">1. Canal Embebido (Banco Aliado Créditos)</text>
    <rect x="345" y="12" width="95" height="20" class="chip-ok" />
    <text x="392" y="26" class="chip-ok-text">COTIZACIÓN OK</text>

    <!-- Simulated Bank Portal Offer Body -->
    <g transform="translate(25, 65)">
      <text x="0" y="18" fill="#0f172a" font-size="15px" font-weight="700">Protección para su Crédito Hipotecario</text>
      <text x="0" y="36" fill="#64748b" font-size="12px">Añada un seguro de vida deudores a su crédito en un solo clic.</text>

      <!-- Price Box -->
      <g transform="translate(0, 55)">
        <rect width="410" height="85" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" rx="6" />
        <text x="20" y="32" fill="#0369a1" font-size="11px" font-weight="700">PRIMA MENSUAL TOTAL (COP)</text>
        <text x="20" y="65" class="hero-price">$ 35.000 <tspan fill="#64748b" font-size="13px" font-weight="500">/ mes (IVA incluido)</tspan></text>
      </g>

      <!-- Coverage Checklist -->
      <g transform="translate(0, 160)">
        <text x="0" y="16" class="label-text">COBERTURAS CONTRATADAS</text>
        
        <circle cx="8" cy="38" r="7" fill="#dcfce7" />
        <text x="8" y="42" fill="#15803d" font-size="10px" font-weight="bold" text-anchor="middle">✓</text>
        <text x="25" y="42" fill="#1e293b" font-size="12px">Muerte accidental e invalidez total permanente ($ 150M)</text>

        <circle cx="8" cy="68" r="7" fill="#dcfce7" />
        <text x="8" y="72" fill="#15803d" font-size="10px" font-weight="bold" text-anchor="middle">✓</text>
        <text x="25" y="72" fill="#1e293b" font-size="12px">Desempleo involuntario: pago de hasta 6 cuotas de crédito</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(0, 260)">
        <rect x="0" y="0" width="230" height="38" class="btn-primary" />
        <text x="115" y="24" class="btn-primary-text">Añadir a mi crédito »</text>

        <rect x="245" y="0" width="165" height="38" class="btn-secondary" />
        <text x="327" y="24" class="btn-secondary-text">Ahora no</text>
      </g>

      <!-- Trust footnote -->
      <g transform="translate(0, 330)">
        <line x1="0" y1="0" x2="410" y2="0" stroke="#e2e8f0" stroke-width="1" />
        <text x="0" y="24" fill="#64748b" font-size="11px">🛡️ Póliza emitida por Solventa Seguros Digitales S.A.</text>
        <text x="0" y="40" fill="#64748b" font-size="11px">Aprobación instantánea con respuesta en 118 ms.</text>
      </g>
    </g>
  </g>

  <!-- Right Column: API Diagnostic & Quota Telemetry (For the Partner) -->
  <g transform="translate(510, 160)">
    <rect width="460" height="490" class="card-bg" />

    <rect width="460" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="8" />
    <text x="20" y="26" class="section-hdr">2. Telemetría de Cuota B2B (Headers RFC 6585)</text>
    <rect x="350" y="12" width="90" height="20" class="chip-partner" />
    <text x="395" y="26" class="chip-partner-text">PLAN GOLD</text>

    <g transform="translate(25, 65)">
      <!-- Quota Gauge & Numbers -->
      <text x="0" y="16" class="label-text">ESTADO DE LA CUOTA MENSUAL DEL SOCIO</text>
      <text x="0" y="38" fill="#0f172a" font-size="20px" font-weight="800">49.980 <tspan fill="#64748b" font-size="14px" font-weight="500">/ 50.000 consumidas</tspan></text>
      <text x="300" y="38" fill="#f59e0b" font-size="14px" font-weight="700">Quedan 20 reqs</text>

      <!-- Progress bar -->
      <rect x="0" y="52" width="410" height="10" class="progress-bg" />
      <rect x="0" y="52" width="408" height="10" class="progress-fill" />

      <text x="0" y="78" fill="#64748b" font-size="11px">⏰ Hora exacta de renovación de la cuota:</text>
      <text x="220" y="78" fill="#0f172a" font-size="11px" font-weight="700">15:00:00 COT (en 25 minutos)</text>

      <!-- HTTP Response & Headers Box -->
      <g transform="translate(0, 100)">
        <text x="0" y="16" class="label-text">CABECERAS DEVUELTAS POR LA API DE SOLVENTA (CA-04)</text>
        
        <rect x="0" y="26" width="410" height="235" class="code-box" />
        <rect x="0" y="26" width="410" height="26" class="code-header" rx="6" />
        <text x="12" y="43" class="code-title">POST /api/v1/quote-edge/quotes → HTTP 200 OK</text>

        <text x="15" y="75" class="code-text">HTTP/1.1 200 OK</text>
        <text x="15" y="93" class="code-text">Content-Type: <tspan class="code-val">application/json</tspan></text>
        
        <!-- Crucial RateLimit Headers -->
        <text x="15" y="117" class="code-text">X-RateLimit-Limit: <tspan class="code-val">50000</tspan></text>
        <text x="15" y="135" class="code-text">X-RateLimit-Remaining: <tspan fill="#fde047" font-weight="bold">20</tspan></text>
        <text x="15" y="153" class="code-text">X-RateLimit-Reset: <tspan class="code-val">1761922800</tspan></text>
        
        <text x="15" y="177" class="code-text">X-RateLimit-Reset-Time: <tspan class="code-val">"2026-10-31T15:00:00Z"</tspan></text>
        <text x="15" y="195" class="code-text">Idempotency-Key: <tspan class="code-val">"c7f18b32-9a01-4c11-88f2"</tspan></text>
        
        <text x="15" y="222" class="code-comment">// CA-04: El socio visualiza el límite, lo que queda y cuándo renueva.</text>
        <text x="15" y="238" class="code-comment">// Permite al socio regular el ritmo de campaña antes de agotar cuota.</text>
      </g>
    </g>
  </g>
</svg>

