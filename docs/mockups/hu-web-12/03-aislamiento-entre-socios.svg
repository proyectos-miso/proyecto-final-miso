<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-bg { fill: #0f172a; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .text-title { fill: #0f172a; font-weight: 700; font-size: 18px; }
      .text-subtitle { fill: #64748b; font-size: 13px; }
      .text-brand { fill: #38bdf8; font-weight: 700; font-size: 18px; }
      .text-subbrand { fill: #94a3b8; font-size: 12px; }
      .text-user { fill: #cbd5e1; font-size: 12px; }
      .text-user-name { fill: #38bdf8; font-weight: 600; }
      .nav-tab { fill: #94a3b8; font-size: 13px; font-weight: 500; }
      .nav-tab-active { fill: #38bdf8; font-size: 13px; font-weight: 600; }
      .tab-indicator { fill: #38bdf8; }
      .section-hdr { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .label-text { fill: #64748b; font-size: 11px; font-weight: 600; }
      .chip-429 { fill: #fee2e2; rx: 10; }
      .chip-429-text { fill: #b91c1c; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .chip-ok { fill: #dcfce7; rx: 10; }
      .chip-ok-text { fill: #15803d; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .code-box { fill: #0f172a; stroke: #1e293b; stroke-width: 1; rx: 6; }
      .code-text { fill: #38bdf8; font-family: monospace; font-size: 10.5px; }
      .code-val { fill: #a5f3fc; font-family: monospace; font-size: 10.5px; }
      .code-red { fill: #f87171; font-family: monospace; font-size: 10.5px; font-weight: bold; }
      .code-green { fill: #4ade80; font-family: monospace; font-size: 10.5px; font-weight: bold; }
      .code-yellow { fill: #fde047; font-family: monospace; font-size: 10.5px; }
      .progress-bg { fill: #e2e8f0; rx: 3; }
      .progress-red { fill: #ef4444; rx: 3; }
      .progress-green { fill: #10b981; rx: 3; }
      .audit-card { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="680" class="bg" />

  <!-- App Header -->
  <rect width="1000" height="54" class="header-bg" />
  <text x="30" y="33" class="text-brand">Solventa</text>
  <text x="112" y="33" class="text-subbrand">B2B Multi-Tenant Edge</text>
  
  <text x="260" y="33" class="nav-tab">Documentación</text>
  <text x="390" y="33" class="nav-tab">Canal Banco Aliado</text>
  <text x="545" y="33" class="nav-tab-active">Aislamiento de Socios</text>
  <rect x="545" y="49" width="145" height="3" class="tab-indicator" />
  
  <text x="770" y="33" class="text-user">Arquitectura: <tspan class="text-user-name">HA-07 / HA-14</tspan></text>

  <!-- Title & Context -->
  <g transform="translate(30, 75)">
    <text x="0" y="15" fill="#64748b" font-size="12px">Portal de Integración B2B &gt; Monitoreo Concurrente &gt; Aislamiento de Socios</text>
    <text x="0" y="42" class="text-title">Aislamiento de Carga entre Socios Concurrentes (CA-03 · HA-07)</text>
    <text x="0" y="62" class="text-subtitle">Banco Aliado tiene la cuota agotada (429), mientras Financiera CooAgro cotiza simultáneamente con total normalidad (200 OK).</text>
  </g>

  <!-- Main Grid: Comparative Side-by-Side View -->
  <!-- Left Side: Partner A (Banco Aliado - Quota Exhausted) -->
  <g transform="translate(30, 160)">
    <rect width="455" height="425" class="card-bg" />

    <!-- Card Header -->
    <rect width="455" height="42" fill="#fef2f2" stroke="#fecaca" stroke-width="1" rx="8" />
    <text x="20" y="26" fill="#991b1b" font-size="13px" font-weight="700">Socio A · Banco Aliado S.A. (ID: PRT-001)</text>
    <rect x="330" y="11" width="105" height="20" class="chip-429" />
    <text x="382" y="25" class="chip-429-text">429 AGOTADO</text>

    <g transform="translate(20, 55)">
      <!-- Quota Status -->
      <text x="0" y="15" class="label-text">CONSUMO MENSUAL CONTRATADO</text>
      <text x="0" y="35" fill="#b91c1c" font-size="18px" font-weight="800">50.000 <tspan fill="#64748b" font-size="13px" font-weight="500">/ 50.000 (0 restantes)</tspan></text>
      
      <rect x="0" y="46" width="415" height="8" class="progress-bg" />
      <rect x="0" y="46" width="415" height="8" class="progress-red" />
      
      <text x="0" y="70" fill="#b91c1c" font-size="11px" font-weight="600">Estado: Bloqueo de cuota hasta las 15:00:00 COT</text>

      <!-- Terminal / API Log Box -->
      <g transform="translate(0, 85)">
        <text x="0" y="15" class="label-text">PETICIÓN SIMULTÁNEA: 14:35:10.102 COT</text>
        
        <rect x="0" y="24" width="415" height="235" class="code-box" />
        <rect x="0" y="24" width="415" height="24" fill="#1e293b" rx="6" />
        <text x="12" y="40" fill="#f87171" font-size="10px" font-family="monospace">Petición Banco Aliado (API Key: ...4417)</text>

        <text x="15" y="68" class="code-text">&gt; POST /api/v1/quote-edge/quotes HTTP/1.1</text>
        <text x="15" y="85" class="code-text">&gt; Host: api.solventa.com</text>
        <text x="15" y="102" class="code-text">&gt; X-Partner-Id: PRT-001</text>
        
        <text x="15" y="125" class="code-red">&lt; HTTP/1.1 429 Too Many Requests</text>
        <text x="15" y="142" class="code-yellow">&lt; Retry-After: 1500</text>
        <text x="15" y="159" class="code-text">&lt; X-RateLimit-Limit: 50000</text>
        <text x="15" y="176" class="code-red">&lt; X-RateLimit-Remaining: 0</text>
        <text x="15" y="193" class="code-text">&lt; X-RateLimit-Reset: 1761922800</text>

        <text x="15" y="218" fill="#fca5a5" font-family="monospace" font-size="10px">{"error":"QUOTA_EXCEEDED","retry_after":1500}</text>
        <text x="15" y="244" fill="#64748b" font-family="monospace" font-size="9.5px">// Solicitud rechazada limpiamente en 14 ms</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Partner B (Financiera CooAgro - Normal Operation) -->
  <g transform="translate(515, 160)">
    <rect width="455" height="425" class="card-bg" />

    <!-- Card Header -->
    <rect width="455" height="42" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="8" />
    <text x="20" y="26" fill="#166534" font-size="13px" font-weight="700">Socio B · Financiera CooAgro (ID: PRT-002)</text>
    <rect x="330" y="11" width="105" height="20" class="chip-ok" />
    <text x="382" y="25" class="chip-ok-text">200 NORMAL</text>

    <g transform="translate(20, 55)">
      <!-- Quota Status -->
      <text x="0" y="15" class="label-text">CONSUMO MENSUAL CONTRATADO</text>
      <text x="0" y="35" fill="#15803d" font-size="18px" font-weight="800">12.450 <tspan fill="#64748b" font-size="13px" font-weight="500">/ 30.000 (17.550 restantes)</tspan></text>
      
      <rect x="0" y="46" width="415" height="8" class="progress-bg" />
      <rect x="0" y="46" width="172" height="8" class="progress-green" />
      
      <text x="0" y="70" fill="#15803d" font-size="11px" font-weight="600">Estado: Capacidad disponible · 58.5% cuota libre</text>

      <!-- Terminal / API Log Box -->
      <g transform="translate(0, 85)">
        <text x="0" y="15" class="label-text">PETICIÓN SIMULTÁNEA: 14:35:10.105 COT</text>
        
        <rect x="0" y="24" width="415" height="235" class="code-box" />
        <rect x="0" y="24" width="415" height="24" fill="#1e293b" rx="6" />
        <text x="12" y="40" fill="#86efac" font-size="10px" font-family="monospace">Petición Financiera CooAgro (API Key: ...8921)</text>

        <text x="15" y="68" class="code-text">&gt; POST /api/v1/quote-edge/quotes HTTP/1.1</text>
        <text x="15" y="85" class="code-text">&gt; Host: api.solventa.com</text>
        <text x="15" y="102" class="code-text">&gt; X-Partner-Id: PRT-002</text>
        
        <text x="15" y="125" class="code-green">&lt; HTTP/1.1 200 OK</text>
        <text x="15" y="142" class="code-text">&lt; Content-Type: application/json</text>
        <text x="15" y="159" class="code-text">&lt; X-RateLimit-Limit: 30000</text>
        <text x="15" y="176" class="code-green">&lt; X-RateLimit-Remaining: 17549</text>
        <text x="15" y="193" class="code-text">&lt; X-RateLimit-Reset: 1761922800</text>

        <text x="15" y="218" fill="#86efac" font-family="monospace" font-size="10px">{"quote_id":"COT-2026-99120","premium":42000}</text>
        <text x="15" y="244" fill="#64748b" font-family="monospace" font-size="9.5px">// Cotización emitida con normalidad en 112 ms</text>
      </g>
    </g>
  </g>

  <!-- Bottom Architecture Guarantee Note (HA-07 / HA-14) -->
  <g transform="translate(30, 600)">
    <rect width="940" height="55" class="audit-card" />
    <text x="20" y="22" fill="#15803d" font-size="12px" font-weight="700">🛡️ Garantía de Aislamiento y Resiliencia Multi-inquilino (HA-07 / HA-14 / CA-03)</text>
    <text x="20" y="40" fill="#166534" font-size="11px">Las ventanas de cuota están particionadas estrictamente por socio (`partner_id`) en la capa de borde distribuida. El agotamiento o sobrecarga</text>
    <text x="20" y="52" fill="#166534" font-size="11px">de Banco Aliado no afecta los límites, tiempos de respuesta ni disponibilidad de Financiera CooAgro ni de ningún otro aliado.</text>
  </g>
</svg>

